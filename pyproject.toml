[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loaf-bot"
dynamic = ["version"]
description = "Python SDK and bot template for the Loaf trading platform API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Loaf Markets" }]
keywords = ["loaf", "trading", "real-estate", "api", "sdk", "bot", "websocket", "l2"]

# Runtime dependencies are intentionally minimal: orders are signed by the engine's native L2
# signer, vendored in loaf/l2/lib (see PROVENANCE.json).
dependencies = [
    "httpx>=0.27",               # REST client (timeouts, HTTP/2, clean errors)
    "websockets>=12.0",          # real-time market & portfolio feeds
]

[project.optional-dependencies]
# `pip install -e ".[l2keys]"` for the wallet flows: deriving and registering the L2 trading key
# (python -m loaf.l2.keys) and the signed IPO purchase (offerings.subscribe).
l2keys = ["eth-account>=0.13,<0.15"]
# `pip install -e ".[dotenv]"` to load a .env file automatically in the examples.
dotenv = ["python-dotenv>=1.0"]
# `pip install -e ".[dev]"` for the test suite, the wallet flows' tests included.
dev = ["pytest>=8.0", "eth-account>=0.13,<0.15"]

[project.urls]
Homepage = "https://loafmarkets.com"

[tool.setuptools.packages.find]
include = ["loaf*"]

# The engine's native L2 signer, one build per platform, its KAT and the provenance that pins them.
[tool.setuptools.package-data]
"loaf.l2" = ["PROVENANCE.json", "kat/*.json", "lib/*/*.so", "lib/*/*.dylib", "lib/*/*.dll"]

# The version lives only in loaf/_version.py; setuptools reads it from there.
[tool.setuptools.dynamic]
version = { attr = "loaf._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
