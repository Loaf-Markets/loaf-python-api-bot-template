[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loaf-bot"
dynamic = ["version"]
description = "Python SDK and bot template for the Loaf trading platform API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Loaf Markets" }]
keywords = ["loaf", "trading", "real-estate", "api", "sdk", "bot", "websocket", "eip712"]

# Runtime dependencies are intentionally minimal.
dependencies = [
    "httpx>=0.27",               # REST client (timeouts, HTTP/2, clean errors)
    "websockets>=12.0",          # real-time market & portfolio feeds
    "eth-account>=0.13,<0.15",   # EIP-712 signing of your orders with your agent key
    "eth-utils>=2",              # keccak / address checksums (installed with eth-account)
    "eth-keys>=0.4",             # holds the agent key (installed with eth-account)
]

[project.optional-dependencies]
# `pip install -e ".[dotenv]"` to load a .env file automatically in the examples.
dotenv = ["python-dotenv>=1.0"]
# `pip install -e ".[dev]"` for the test suite.
dev = ["pytest>=8.0"]
# `pip install -e ".[fast]"` signs orders with libsecp256k1 instead of pure Python: about 0.2 ms
# per signature instead of 2-4 ms, identical signatures. Python 3.9-3.13 only: coincurve has no
# 3.14 build yet, so on 3.14 this extra installs nothing.
fast = ["coincurve>=21,<22; python_version < '3.14'"]

[project.urls]
Homepage = "https://loafmarkets.com"

[tool.setuptools.packages.find]
include = ["loaf*"]

# The version lives only in loaf/_version.py; setuptools reads it from there.
[tool.setuptools.dynamic]
version = { attr = "loaf._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
